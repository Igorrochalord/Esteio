<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Módulos: Vendas, Estoque, Clientes, Financeiro, Ordens de serviço e Relatórios">
  <style>
    text { font-family: "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
    .card { opacity: 0; animation: pop .6s cubic-bezier(.2,.7,.2,1) forwards; }
    .c1{animation-delay:.1s}.c2{animation-delay:.3s}.c3{animation-delay:.5s}.c4{animation-delay:.7s}.c5{animation-delay:.9s}.c6{animation-delay:1.1s}
    @keyframes pop { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
    .ico { transform-box: fill-box; transform-origin: center; animation: bob 3s ease-in-out infinite alternate; }
    .c2 .ico{animation-delay:.4s}.c3 .ico{animation-delay:.8s}.c4 .ico{animation-delay:1.2s}.c5 .ico{animation-delay:1.6s}.c6 .ico{animation-delay:2s}
    @keyframes bob { from { transform: translateY(0) } to { transform: translateY(-5px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
  </defs>
  <!-- 6 cartões de 180px, espaçados 24px -->
  <g transform="translate(12 20)"><g class="card c1">
    <rect width="174" height="160" rx="18" fill="url(#g)" stroke="#3b82f6" stroke-opacity=".5"/>
    <g class="ico" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(67 30)"><path d="M2 2h6l5 24h22l5-17H11"/><circle cx="15" cy="34" r="2.5"/><circle cx="33" cy="34" r="2.5"/></g>
    <text x="87" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Vendas</text>
    <text x="87" y="134" text-anchor="middle" font-size="12.5" fill="#bfdbfe">à vista, fiado, cancelar</text></g></g>
  <g transform="translate(210 20)"><g class="card c2">
    <rect width="174" height="160" rx="18" fill="url(#g)" stroke="#3b82f6" stroke-opacity=".5"/>
    <g class="ico" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linejoin="round" transform="translate(67 28)"><path d="M20 2 38 11v20L20 40 2 31V11Z"/><path d="M2 11l18 9 18-9M20 20v20"/></g>
    <text x="87" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Estoque</text>
    <text x="87" y="134" text-anchor="middle" font-size="12.5" fill="#bfdbfe">entradas, mínimo, alertas</text></g></g>
  <g transform="translate(408 20)"><g class="card c3">
    <rect width="174" height="160" rx="18" fill="url(#g)" stroke="#3b82f6" stroke-opacity=".5"/>
    <g class="ico" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" transform="translate(67 28)"><circle cx="15" cy="12" r="8"/><path d="M2 38c0-8 6-13 13-13s13 5 13 13"/><circle cx="32" cy="14" r="6"/><path d="M33 25c5 1 8 6 8 12"/></g>
    <text x="87" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Clientes</text>
    <text x="87" y="134" text-anchor="middle" font-size="12.5" fill="#bfdbfe">cadastro e histórico</text></g></g>
  <g transform="translate(606 20)"><g class="card c4">
    <rect width="174" height="160" rx="18" fill="url(#g)" stroke="#3b82f6" stroke-opacity=".5"/>
    <g class="ico" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(67 28)"><rect x="2" y="8" width="38" height="28" rx="5"/><path d="M2 17h38M10 28h8"/></g>
    <text x="87" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Financeiro</text>
    <text x="87" y="134" text-anchor="middle" font-size="12.5" fill="#bfdbfe">contas, caixa, DRE</text></g></g>
  <g transform="translate(804 20)"><g class="card c5">
    <rect width="174" height="160" rx="18" fill="url(#g)" stroke="#3b82f6" stroke-opacity=".5"/>
    <g class="ico" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(67 28)"><path d="M26 4a9 9 0 0 0-10 12L4 28a4 4 0 0 0 6 6l12-12A9 9 0 0 0 34 12l-6 6-5-1-1-5Z"/></g>
    <text x="87" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Ordens de serviço</text>
    <text x="87" y="134" text-anchor="middle" font-size="12.5" fill="#bfdbfe">quadro, prazos, faturar</text></g></g>
  <g transform="translate(1002 20)"><g class="card c6">
    <rect width="174" height="160" rx="18" fill="url(#g)" stroke="#3b82f6" stroke-opacity=".5"/>
    <g class="ico" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" transform="translate(67 28)"><path d="M2 40h38"/><path d="M8 32V20M18 32V8M28 32V16M38 32V4"/></g>
    <text x="87" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Relatórios</text>
    <text x="87" y="134" text-anchor="middle" font-size="12.5" fill="#bfdbfe">Excel, PDF, comparações</text></g></g>
</svg>
