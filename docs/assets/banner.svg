<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Núcleo ERP: gestão completa no seu computador, sem internet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.6" stop-color="#172554"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="r"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
    .up   { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s }
    .d4 { animation-delay: 1.05s } .d5 { animation-delay: 1.35s }
    @keyframes up { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0);
           animation: grow 1.1s cubic-bezier(.2,.7,.2,1) forwards, breathe 4s ease-in-out 2.2s infinite alternate; }
    @keyframes grow { to { transform: scaleY(1) } }
    @keyframes breathe { from { transform: scaleY(1) } to { transform: scaleY(.82) } }
    .b1 { animation-delay: .6s, 2.2s } .b2 { animation-delay: .75s, 2.6s } .b3 { animation-delay: .9s, 3s }
    .b4 { animation-delay: 1.05s, 2.4s } .b5 { animation-delay: 1.2s, 2.8s } .b6 { animation-delay: 1.35s, 3.2s }
    .float { animation: float 6s ease-in-out infinite alternate; }
    @keyframes float { from { transform: translateY(0) } to { transform: translateY(-10px) } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .7 } 100% { transform: scale(2.6); opacity: 0 } }
    .row { opacity: 0; animation: slide .7s ease-out forwards; }
    .r1 { animation-delay: 1.5s } .r2 { animation-delay: 1.7s } .r3 { animation-delay: 1.9s }
    @keyframes slide { from { opacity: 0; transform: translateX(16px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <g opacity="0.08" stroke="#fff">
      <path d="M0 90H1200M0 180H1200M0 270H1200M300 0V360M600 0V360M900 0V360"/>
    </g>

    <!-- texto -->
    <g transform="translate(64 0)">
      <g class="up d1">
        <rect x="0" y="62" width="214" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/>
        <circle cx="20" cy="77" r="5" fill="#4ade80"/>
        <circle cx="20" cy="77" r="5" fill="#4ade80" class="pulse"/>
        <text x="34" y="82" font-size="14" fill="#dbeafe" font-weight="600">Funciona sem internet</text>
      </g>
      <text class="up d2" x="0" y="160" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Núcleo ERP</text>
      <text class="up d3" x="2" y="204" font-size="24" fill="#bfdbfe">A gestão da sua empresa, instalada no seu computador.</text>
      <text class="up d4" x="2" y="250" font-size="17" fill="#93c5fd">Vendas · Estoque · Clientes · Financeiro · Ordens de serviço · Relatórios</text>
      <text class="up d5" x="2" y="296" font-size="15" fill="#e0e7ff" fill-opacity="0.75">Windows e Linux  ·  dados no seu computador  ·  com as cores e o logo da sua empresa</text>
    </g>

    <!-- janela do app -->
    <g transform="translate(820 52)">
      <g class="float">
        <rect width="320" height="256" rx="16" fill="#0b1220" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.18"/>
        <circle cx="22" cy="22" r="5" fill="#f87171"/><circle cx="40" cy="22" r="5" fill="#fbbf24"/><circle cx="58" cy="22" r="5" fill="#4ade80"/>
        <text x="20" y="62" font-size="12" fill="#93c5fd">Vendas do mês</text>
        <text x="20" y="88" font-size="24" font-weight="700" fill="#ffffff">R$ 48.920,00</text>
        <text x="190" y="88" font-size="13" font-weight="700" fill="#4ade80">▲ 18%</text>
        <g transform="translate(20 104)">
          <rect class="bar b1" x="0"   y="50" width="30" height="40" rx="5" fill="#3b82f6"/>
          <rect class="bar b2" x="47"  y="30" width="30" height="60" rx="5" fill="#3b82f6"/>
          <rect class="bar b3" x="94"  y="42" width="30" height="48" rx="5" fill="#3b82f6"/>
          <rect class="bar b4" x="141" y="14" width="30" height="76" rx="5" fill="#60a5fa"/>
          <rect class="bar b5" x="188" y="24" width="30" height="66" rx="5" fill="#60a5fa"/>
          <rect class="bar b6" x="235" y="0"  width="30" height="90" rx="5" fill="#93c5fd"/>
        </g>
        <g font-size="11" fill="#cbd5e1">
          <g class="row r1"><rect x="20" y="206" width="280" height="1" fill="#fff" fill-opacity=".12"/><text x="20" y="222">Pão de forma</text><text x="300" y="222" text-anchor="end" fill="#ffffff">R$ 12,90</text></g>
          <g class="row r2"><text x="20" y="242">OS #142 · troca de tela</text><text x="300" y="242" text-anchor="end" fill="#4ade80">pronta</text></g>
        </g>
      </g>
    </g>
  </g>
</svg>
