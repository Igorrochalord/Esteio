name: ci

# Release automática: a cada push na main com commits feat/fix desde a última versão, o CI
# calcula a próxima (scripts/next-version.sh), gera os instaladores com essa versão e publica
# a release vX.Y.Z (a tag é criada pela própria release). Docs/build/test sozinhos não geram versão.
# "Run workflow" (manual) permite forçar patch/minor/major.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: "Versão: auto (pelos commits), patch, minor ou major"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: ci-${{ github.ref }}
  # na main, um push novo não interrompe uma release em andamento (o próximo entra na seguinte)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: lint e testes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: libs do Tauri (WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: make install
      - run: make web-build # o app Tauri embute o dist/ ao compilar
      - run: make lint
      - run: make test

  version:
    name: próxima versão
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ steps.next.outputs.release }}
      previous: ${{ steps.next.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico e tags, para comparar com a última versão
      - id: next
        run: bash scripts/next-version.sh "${{ inputs.bump || 'auto' }}" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

  windows:
    name: instalador Windows
    needs: [check, version]
    # PR: só confere que compila. main: só quando há versão nova.
    if: ${{ !cancelled() && needs.check.result == 'success' && (github.event_name == 'pull_request' || needs.version.outputs.release == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: versão
        if: needs.version.outputs.release == 'true'
        run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - name: build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri build
      # nomes fixos: o README aponta para releases/latest/download/<nome>
      - name: renomear para o download
        shell: bash
        run: |
          mkdir -p dist-release
          cp target/release/bundle/nsis/*-setup.exe dist-release/NucleoERP-Windows-Instalador.exe
          cp target/release/bundle/msi/*.msi dist-release/NucleoERP-Windows.msi
      - uses: actions/upload-artifact@v7
        with:
          name: nucleo-erp-windows
          path: dist-release/*
          if-no-files-found: error

  linux:
    name: pacotes Linux
    needs: [check, version]
    if: ${{ !cancelled() && needs.check.result == 'success' && (github.event_name == 'pull_request' || needs.version.outputs.release == 'true') }}
    # 22.04: glibc mais antiga, então o AppImage roda em mais distribuições
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: libs do Tauri (WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config build-essential file
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: versão
        if: needs.version.outputs.release == 'true'
        run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - name: build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri build -- --bundles appimage,deb,rpm
      - name: renomear para o download
        run: |
          mkdir -p dist-release
          cp target/release/bundle/appimage/*.AppImage dist-release/NucleoERP-Linux.AppImage
          cp target/release/bundle/deb/*.deb dist-release/NucleoERP-Linux.deb
          cp target/release/bundle/rpm/*.rpm dist-release/NucleoERP-Linux.rpm
      - uses: actions/upload-artifact@v7
        with:
          name: nucleo-erp-linux
          path: dist-release/*
          if-no-files-found: error

  release:
    name: publicar release
    needs: [version, windows, linux]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: nucleo-erp-*
          path: dist-release
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
      # cria a tag vX.Y.Z neste commit e publica (não é rascunho: os links "latest" do README
      # passam a baixar esta versão). Tag criada pelo GITHUB_TOKEN não dispara outro CI.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Núcleo ERP ${{ needs.version.outputs.version }}
          body_path: notes.md
          draft: false
          make_latest: true
          files: dist-release/*
          fail_on_unmatched_files: true
