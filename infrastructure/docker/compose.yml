name: nucleo-erp

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  # S3 compatível para dev (imagens oficiais do MinIO deixaram de ser públicas; ver ADR 0001)
  storage:
    image: chrislusf/seaweedfs:4.50
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"nucleo","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -ip=storage -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - s3data:/data
    ports:
      - "8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40

  storage-init:
    image: chrislusf/seaweedfs:4.50
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "s3.bucket.create -name ${S3_BUCKET}" | weed shell -master=storage:9333 2>&1 | tee /tmp/out
        echo "s3.bucket.list" | weed shell -master=storage:9333 | grep -q "${S3_BUCKET}" && echo "bucket ${S3_BUCKET} ok"
    restart: "no"

  api:
    build:
      context: ../../apps/backend
      target: dev
    env_file: ../../.env
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - ../../apps/backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

volumes:
  pgdata:
  s3data:
