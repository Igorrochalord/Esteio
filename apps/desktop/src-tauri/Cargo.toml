[package]
name = "nucleo-erp"
version = "0.1.0"
description = "Núcleo ERP — cliente desktop"
edition = "2021"

[lib]
name = "nucleo_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
